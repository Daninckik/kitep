name: book-checker

services:
  web:
    build: .
    container_name: book-checker
    ports:
      - "8077:8077"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - DEV_AUTO_LOGIN=0
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports
      - ./data:/app/data
      - ./static:/app/static
    restart: unless-stopped
