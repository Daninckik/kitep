<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Государственный герб КР (стилизация; для тиража заменить официальным файлом) -->
  <defs>
    <path id="ringTop" d="M 200 38 m -138 162 a 138 138 0 0 1 276 0" fill="none"/>
    <path id="ringBottom" d="M 62 200 a 138 138 0 0 0 276 0" fill="none"/>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E9BD6"/>
      <stop offset="1" stop-color="#1470A8"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="200" r="196" fill="#F2C230"/>
  <circle cx="200" cy="200" r="196" fill="none" stroke="#B98A1D" stroke-width="6"/>
  <circle cx="200" cy="200" r="152" fill="url(#sky)" stroke="#B98A1D" stroke-width="5"/>

  <text font-family="Georgia, serif" font-size="27" font-weight="bold" fill="#7A5A10" letter-spacing="2">
    <textPath href="#ringTop" startOffset="50%" text-anchor="middle">КЫРГЫЗ РЕСПУБЛИКАСЫ</textPath>
  </text>

  <!-- Восходящее солнце -->
  <g transform="translate(200,208)">
    <g stroke="#FFEF9C" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-64" x2="0" y2="-92"/>
      <line x1="-28" y1="-58" x2="-40" y2="-84" />
      <line x1="28" y1="-58" x2="40" y2="-84"/>
      <line x1="-52" y1="-38" x2="-74" y2="-54"/>
      <line x1="52" y1="-38" x2="74" y2="-54"/>
      <line x1="-64" y1="-10" x2="-92" y2="-14"/>
      <line x1="64" y1="-10" x2="92" y2="-14"/>
    </g>
    <circle r="52" fill="#FFDD55"/>
  </g>

  <!-- Хребет Ала-Тоо -->
  <path d="M 60 250 L 110 190 L 140 224 L 175 172 L 208 218 L 240 180 L 272 222 L 305 192 L 340 250 Z"
        fill="#FFFFFF" opacity="0.95"/>
  <path d="M 60 250 L 340 250 L 340 282 Q 200 312 60 282 Z" fill="#2E7DB0"/>

  <!-- Крылья Манаса (стилизованный беркут) -->
  <g fill="#FFFFFF" opacity="0.92">
    <path d="M 196 300 Q 140 296 96 268 Q 128 306 178 316 Q 190 318 196 312 Z"/>
    <path d="M 204 300 Q 260 296 304 268 Q 272 306 222 316 Q 210 318 204 312 Z"/>
    <circle cx="200" cy="304" r="10"/>
  </g>

  <!-- Колосья и хлопок по нижней дуге -->
  <text font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#7A5A10" letter-spacing="4">
    <textPath href="#ringBottom" startOffset="50%" text-anchor="middle">✦ ✦ ✦</textPath>
  </text>
</svg>
